<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wadai Economy Portal</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      background-color: #f3f4f6;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      // --- 状態管理 (デモデータを削除し、空またはLocalStorageから読み込む構成に変更) ---
      const [user, setUser] = useState(() => {
        const saved = localStorage.getItem('wadai_user');
        return saved ? JSON.parse(saved) : { name: '', studentId: '', semester: '1年前期' };
      });

      const [courses, setCourses] = useState(() => {
        const saved = localStorage.getItem('wadai_courses');
        return saved ? JSON.parse(saved) : [];
      });

      const [activeTab, setActiveTab] = useState('timetable'); // timetable | credits | profile
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingCourse, setEditingCourse] = useState(null);

      // フォームの入力値状態
      const [formValues, setFormValues] = useState({
        name: '',
        room: '',
        day: 'Mon',
        period: 1,
        credits: 2,
        category: 'common',
        semester: '前期'
      });

      // LocalStorageへの自動保存
      useEffect(() => {
        localStorage.setItem('wadai_user', JSON.stringify(user));
      }, [user]);

      useEffect(() => {
        localStorage.setItem('wadai_courses', JSON.stringify(courses));
      }, [courses]);

      // 曜日と時限の定義
      const days = [
        { key: 'Mon', label: '月' },
        { key: 'Tue', label: '火' },
        { key: 'Wed', label: '水' },
        { key: 'Thu', label: '木' },
        { key: 'Fri', label: '金' }
      ];
      const periods = [1, 2, 3, 4, 5];

      // 科目区分の定義
      const categories = {
        common: { label: '共通教育科目', color: 'bg-emerald-500', text: 'text-emerald-700', bgLight: 'bg-emerald-50', border: 'border-emerald-200', target: 40 },
        specialized: { label: '専門教育科目', color: 'bg-blue-500', text: 'text-blue-700', bgLight: 'bg-blue-50', border: 'border-blue-200', target: 64 },
        related: { label: '関連科目', color: 'bg-amber-500', text: 'text-amber-700', bgLight: 'bg-amber-50', border: 'border-amber-200', target: 20 }
      };

      // 指定されたコマの授業を取得
      const getCourseAt = (day, period) => {
        return courses.find(c => c.day === day && Number(c.period) === Number(period));
      };

      // モーダルを開く（新規 or 編集）
      const openModal = (day = 'Mon', period = 1, course = null) => {
        if (course) {
          setEditingCourse(course);
          setFormValues({ ...course });
        } else {
          setEditingCourse(null);
          setFormValues({
            name: '',
            room: '',
            day: day,
            period: period,
            credits: 2,
            category: 'common',
            semester: user.semester.includes('前期') ? '前期' : '後期'
          });
        }
        setIsModalOpen(true);
      };

      // 授業の保存処理
      const handleSaveCourse = (e) => {
        e.preventDefault();
        if (!formValues.name.trim()) return alert('授業名を入力してください');

        if (editingCourse) {
          // 編集時
          setCourses(courses.map(c => c.id === editingCourse.id ? { ...formValues } : c));
        } else {
          // 新規追加（既存の同じコマの授業があれば上書き警告または差し替え）
          const existing = getCourseAt(formValues.day, formValues.period);
          if (existing) {
            if (!confirm('このコマには既に授業が登録されています。上書きしますか？')) return;
            setCourses(courses.filter(c => c.id !== existing.id).concat({ ...formValues, id: Date.now().toString() }));
          } else {
            setCourses([...courses, { ...formValues, id: Date.now().toString() }]);
          }
        }
        setIsModalOpen(false);
      };

      // 授業の削除処理
      const handleDeleteCourse = (id) => {
        if (confirm('この授業を削除しますか？')) {
          setCourses(courses.filter(c => c.id !== id));
          setIsModalOpen(false);
        }
      };

      // 単位数の計算
      const totalCredits = courses.reduce((sum, c) => sum + Number(c.credits), 0);
      const categoryCredits = (cat) => courses.filter(c => c.category === cat).reduce((sum, c) => sum + Number(c.credits), 0);

      return (
        <div className="min-h-screen flex flex-col">
          {/* --- ヘッダー (和歌山大学経済学部のブランドカラー #003B71 を基調に) --- */}
          <header className="bg-[#003B71] text-white shadow-md p-4">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
              <div>
                <h1 className="text-xl font-bold tracking-wider">Wadai Economy Portal</h1>
                <p className="text-xs text-blue-200 mt-0.5">和歌山大学経済学部生向け ポータル</p>
              </div>
              
              {/* ユーザー簡易表示 */}
              <div className="flex items-center gap-3 bg-white/10 px-4 py-2 rounded-lg text-sm">
                <div className="text-right">
                  <div className="font-medium">{user.name || '未設定（プロフィールへ）'}</div>
                  <div className="text-xs text-blue-200">{user.studentId ? `学籍番号: ${user.studentId}` : '学籍番号未設定'} | {user.semester}</div>
                </div>
              </div>
            </div>
          </header>

          {/* --- リンク＆ナビゲーション帯 --- */}
          <div className="bg-white border-b border-gray-200 shadow-sm sticky top-0 z-10">
            <div className="max-w-7xl mx-auto px-4 flex flex-col md:flex-row md:items-center md:justify-between gap-4 py-2">
              {/* アプリ内タブ切り替え */}
              <nav className="flex gap-2">
                <button 
                  onClick={() => setActiveTab('timetable')}
                  className={`px-4 py-2 rounded-md text-sm font-medium transition-colors ${activeTab === 'timetable' ? 'bg-[#003B71] text-white' : 'text-gray-600 hover:bg-gray-100'}`}
                >
                  📅 時間割管理
                </button>
                <button 
                  onClick={() => setActiveTab('credits')}
                  className={`px-4 py-2 rounded-md text-sm font-medium transition-colors ${activeTab === 'credits' ? 'bg-[#003B71] text-white' : 'text-gray-600 hover:bg-gray-100'}`}
                >
                  🎓 単位進捗状況
                </button>
                <button 
                  onClick={() => setActiveTab('profile')}
                  className={`px-4 py-2 rounded-md text-sm font-medium transition-colors ${activeTab === 'profile' ? 'bg-[#003B71] text-white' : 'text-gray-600 hover:bg-gray-100'}`}
                >
                  👤 プロフィール設定
                </button>
              </nav>

              {/* 追加された大学公式外部システムリンク */}
              <div className="flex items-center gap-2 flex-wrap text-xs font-semibold">
                <span className="text-gray-500 mr-1">🏫 学内リンク:</span>
                <a 
                  href="https://kmags.wakayama-u.ac.jp/campusweb/campusportal.do?page=main" 
                  target="_blank" 
                  rel="noopener noreferrer"
                  className="bg-sky-50 text-sky-700 border border-sky-200 px-3 py-1.5 rounded-md hover:bg-sky-100 transition-colors flex items-center gap-1 shadow-2xs"
                >
                  教育サポートシステム (CampusWeb) ↗
                </a>
                <a 
                  href="https://moodle2026.wakayama-u.ac.jp/2026/" 
                  target="_blank" 
                  rel="noopener noreferrer"
                  className="bg-orange-50 text-orange-700 border border-orange-200 px-3 py-1.5 rounded-md hover:bg-orange-100 transition-colors flex items-center gap-1 shadow-2xs"
                >
                  Moodle 2026 ↗
                </a>
              </div>
            </div>
          </div>

          {/* --- メインコンテンツ領域 --- */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6">
            
            {/* 1. 時間割タブ */}
            {activeTab === 'timetable' && (
              <div className="space-y-4">
                <div className="flex justify-between items-center">
                  <h2 className="text-lg font-bold text-gray-800">今学期の時間割</h2>
                  <p className="text-xs text-gray-500">※ コマを選択すると授業の登録・変更ができます</p>
                </div>

                <div className="overflow-x-auto bg-white rounded-xl shadow-xs border border-gray-200">
                  <table className="w-full border-collapse min-w-[650px]">
                    <thead>
                      <tr className="bg-gray-50 border-b border-gray-200">
                        <th className="w-16 p-3 text-center text-xs font-bold text-gray-500 tracking-wider">時限</th>
                        {days.map(d => (
                          <th key={d.key} className="p-3 text-center text-sm font-bold text-gray-700 tracking-wider w-1/5 border-l border-gray-200">
                            {d.label}曜日
                          </th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {periods.map(p => (
                        <tr key={p} className="border-b border-gray-100 last:border-none">
                          <td className="p-4 text-center bg-gray-50/50">
                            <div className="font-bold text-gray-700">{p}</div>
                            <div className="text-[10px] text-gray-400 mt-0.5">限</div>
                          </td>
                          {days.map(d => {
                            const course = getCourseAt(d.key, p);
                            return (
                              <td 
                                key={d.key} 
                                onClick={() => openModal(d.key, p, course)}
                                className={`p-2 border-l border-gray-100 vertical-top h-28 cursor-pointer transition-all hover:bg-gray-50 group relative`}
                              >
                                {course ? (
                                  <div className={`h-full w-full rounded-lg p-2 border ${categories[course.category].border} ${categories[course.category].bgLight} flex flex-col justify-between shadow-2xs`}>
                                    <div>
                                      <div className="text-xs font-bold text-gray-800 line-clamp-2 leading-snug">{course.name}</div>
                                      {course.room && (
                                        <div className="text-[11px] text-gray-500 mt-1 flex items-center gap-0.5">
                                          📍 {course.room}
                                        </div>
                                      )}
                                    </div>
                                    <div className="flex justify-between items-center mt-2 pt-1 border-t border-gray-200/50">
                                      <span className={`text-[9px] px-1.5 py-0.5 rounded font-bold uppercase text-white ${categories[course.category].color}`}>
                                        {course.credits}単位
                                      </span>
                                      <span className="text-[10px] text-gray-400 opacity-0 group-hover:opacity-100 transition-opacity">
                                        編集
                                      </span>
                                    </div>
                                  </div>
                                ) : (
                                  <div className="h-full w-full border border-dashed border-gray-200 rounded-lg flex items-center justify-center text-gray-300 group-hover:text-gray-400 group-hover:border-gray-300 transition-colors">
                                    <span className="text-xl font-light">+</span>
                                  </div>
                                )}
                              </td>
                            );
                          })}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* 2. 単位進捗状況タブ */}
            {activeTab === 'credits' && (
              <div className="space-y-6">
                <h2 className="text-lg font-bold text-gray-800">卒業要件単位の確認
