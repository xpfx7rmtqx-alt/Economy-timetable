<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wadai Economy Portal</title>
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#003B71" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3429/3429158.png" />

    <style>
      @media (max-width: 768px) {
        /* 時間割のテーブル（表）の横幅がはみ出たとき、指で左右にスライドできるようにします */
        table {
          display: block;
          overflow-x: auto;
          white-space: nowrap;
          -webkit-overflow-scrolling: touch; /* スマホでスイスイ滑らかに動くようにするお守り */
        }
        /* マス目の中の文字がギューッと潰れないように、1マスの最低の横幅をしっかり確保します */
        th, td {
          min-width: 80px; 
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('./sw.js').then(function(registration) {
            console.log('PWA ServiceWorker ready!');
          }).catch(function(err) {
            console.log('PWA ServiceWorker failed: ', err);
          });
        });
      }
    </script>
  </body>
</html>
