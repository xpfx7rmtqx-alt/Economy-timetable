<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Wadai Economy Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      background-color: #f4f7fb;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .pb-safe {
      padding-bottom: calc(0px + env(safe-area-inset-bottom, 0px));
    }
    .pt-safe {
      padding-top: calc(0px + env(safe-area-inset-top, 0px));
    }
    /* スクロールバー非表示 */
    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [user, setUser] = useState(() => {
        const saved = localStorage.getItem('wadai_user');
        return saved ? JSON.parse(saved) : { name: '', studentId: '', semester: '1年前期' };
      });

      // 画像のシラバスに近い初期データをセット
      const initialCourses = [
        { id: '1', name: '食料経済学A', room: '西2号館W2-101', day: 'Tue', period: 1, credits: 2, category: 'specialized', quarter: '1Q' },
        { id: '2', name: '専門演習', room: '西2号館W2-201', day: 'Mon', period: 2, credits: 2, category: 'specialized', quarter: '1Q' },
        { id: '3', name: '地球科学', room: '東1号館E1-102', day: 'Tue', period: 2, credits: 2, category: 'common', quarter: '1Q' },
        { id: '4', name: '天文学', room: '東1号館E1-103', day: 'Wed', period: 2, credits: 2, category: 'common', quarter: '1Q' },
        { id: '5', name: '宇宙開発論', room: 'E1-101', day: 'Thu', period: 2, credits: 2, category: 'common', quarter: '1Q' },
        { id: '6', name: '国際貿易論A', room: 'E1-101', day: 'Tue', period: 3, credits: 2, category: 'specialized', quarter: '1Q' },
        { id: '7', name: '公益事業論A', room: 'W2-101', day: 'Wed', period: 3, credits: 2, category: 'specialized', quarter: '1Q' },
        { id: '8', name: '西洋経済史', room: '西2号館W2-101', day: 'Thu', period: 3, credits: 2, category: 'specialized', quarter: '1Q' },
        { id: '9', name: '生と死を考える', room: 'E1-101', day: 'Mon', period: 4, credits: 2, category: 'common', quarter: '1Q' },
        { id: '10', name: 'データを用いた実証分析入門', room: '西2号館W2-102', day: 'Tue', period: 4, credits: 2, category: 'specialized', quarter: '1Q' },
      ];

      const [courses, setCourses] = useState(() => {
        const saved = localStorage.getItem('wadai_courses');
        return saved ? JSON.parse(saved) : initialCourses;
      });

      // 各卒業要件項目のカウンター用ステート
      const [creditCounts, setCreditCounts] = useState(() => {
        const saved = localStorage.getItem('wadai_credit_counts');
        return saved ? JSON.parse(saved) : {
          mirai: 0, kikan: 0, joho: 0, eigoAB: 0, eigoCD: 0, ds: 0,
          kisoEnshu: 0, keizaiNyumon: 0, tokeiNyumon: 0, progHissu: 0, progSenHissu: 0, progSen: 0, taProg: 0,
          hatten: 0, senmon: 0, sotsuken: 0,
          jiyu: 0
        };
      });

      const [activeTab, setActiveTab] = useState('timetable');
      const [activeQuarter, setActiveQuarter] = useState('1Q');
      
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingCourse, setEditingCourse] = useState(null);

      const [formValues, setFormValues] = useState({
        name: '', room: '', day: 'Mon', period: 1, credits: 2, category: 'common', quarter: '1Q'
      });

      useEffect(() => {
        localStorage.setItem('wadai_user', JSON.stringify(user));
      }, [user]);

      useEffect(() => {
        localStorage.setItem('wadai_courses', JSON.stringify(courses));
      }, [courses]);

      // カウンター変更時に自動保存
      useEffect(() => {
        localStorage.setItem('wadai_credit_counts', JSON.stringify(creditCounts));
      }, [creditCounts]);

      const days = [
        { key: 'Mon', label: '月' },
        { key: 'Tue', label: '火' },
        { key: 'Wed', label: '水' },
        { key: 'Thu', label: '木' },
        { key: 'Fri', label: '金' }
      ];
      
      const periods = [1, 2, 3, 4, 5, 6];
      const periodTimes = {
        1: { start: '09:10', end: '10:40' },
        2: { start: '10:50', end: '12:20' },
        3: { start: '13:10', end: '14:40' },
        4: { start: '14:50', end: '16:20' },
        5: { start: '16:30', end: '18:00' },
        6: { start: '18:10', end: '19:40' }
      };
      
      const quarters = ['1Q', '2Q', '3Q', '4Q'];
      const semesters = ['1年前期', '1年後期', '2年前期', '2年後期', '3年前期', '3年後期', '4年前期', '4年後期'];

      // 卒業要件のデータ構造の定義
      const creditStructure = [
        {
          category: '教養教育科目',
          totalTarget: 25,
          items: [
            { key: 'mirai', label: '教養科目(基幹) 「わかやま未来学」', target: 1 },
            { key: 'kikan', label: '「わかやま未来学」以外の教養科目(基幹)', target: 12 },
            { key: 'joho', label: '教養科目(実践) 「情報処理ⅠA」・「情報処理ⅠB」', target: 2 },
            { key: 'eigoAB', label: '教養科目(実践) 「英語ⅠA」・「英語ⅠB」', target: 4 },
            { key: 'eigoCD', label: '教養科目(実践) 「英語ⅠC」・「英語ⅠD」又は初修外国語', target: 4 },
            { key: 'ds', label: '教養科目(実践) データサイエンスへの誘いA・B', target: 2 },
          ]
        },
        {
          category: '専門教育科目',
          totalTarget: 81,
          items: [
            { key: 'kisoEnshu', label: '専門基礎科目 「基礎演習Ⅰ」・「基礎演習Ⅱ」', target: 2 },
            { key: 'keizaiNyumon', label: '専門必修科目 「経済学入門A」・「経済学入門B」', target: 2 },
            { key: 'tokeiNyumon', label: '専門必修科目 「統計学入門A」・「統計学入門B」', target: 2 },
            { key: 'progHissu', label: 'プログラム科目 履修プログラム必修科目', target: 2 },
            { key: 'progSenHissu', label: 'プログラム科目 履修プログラム選択必修科目', target: 14 },
            { key: 'progSen', label: 'プログラム科目 履修プログラム選択科目', target: 24 },
            { key: 'taProg', label: 'プログラム科目 他プログラム・地域・キャリアデザイン科目', target: 27 },
            { key: 'hatten', label: '専門演習科目 「発展演習」', target: 1 },
            { key: 'senmon', label: '専門演習科目 「専門演習」', target: 3 },
            { key: 'sotsuken', label: '専門演習科目 「卒業研究」', target: 4 },
          ]
        },
        {
          category: '連携展開科目または自由選択',
          totalTarget: 18,
          items: [
            { key: 'jiyu', label: '連携展開科目、各超過単位、他学部開放科目等', target: 18 },
          ]
        }
      ];

      const getCourseAt = (day, period) => {
        return courses.find(c => (c.quarter || '1Q') === activeQuarter && c.day === day && Number(c.period) === Number(period));
      };

      const openModal = (day = 'Mon', period = 1, course = null) => {
        if (course) {
          setEditingCourse(course);
          setFormValues({ ...course });
        } else {
          setEditingCourse(null);
          setFormValues({
            name: '', room: '', day: day, period: period, credits: 2, category: 'common', quarter: activeQuarter
          });
        }
        setIsModalOpen(true);
      };

      const handleSaveCourse = (e) => {
        e.preventDefault();
        if (!formValues.name.trim()) return alert('授業名を入力してください');
        if (editingCourse) {
          setCourses(courses.map(c => c.id === editingCourse.id ? { ...formValues } : c));
        } else {
          const existing = getCourseAt(formValues.day, formValues.period);
          if (existing) {
            if (!confirm('このコマには既に授業が登録されています。上書きしますか？')) return;
            setCourses(courses.filter(c => c.id !== existing.id).concat({ ...formValues, id: Date.now().toString() }));
          } else {
            setCourses([...courses, { ...formValues, id: Date.now().toString() }]);
          }
        }
        setIsModalOpen(false);
      };

      const handleDeleteCourse = (id) => {
        if (confirm('この授業を削除しますか？')) {
          setCourses(courses.filter(c => c.id !== id));
          setIsModalOpen(false);
        }
      };

      const handleIncrement = (key) => {
        setCreditCounts(prev => ({ ...prev, [key]: prev[key] + 1 }));
      };

      const handleDecrement = (key) => {
        setCreditCounts(prev => ({ ...prev, [key]: Math.max(0, prev[key] - 1) }));
      };

      const getCategoryTotal = (items) => {
        return items.reduce((sum, item) => sum + (creditCounts[item.key] || 0), 0);
      };

      const totalCountedCredits = Object.values(creditCounts).reduce((sum, val) => sum + val, 0);
      const todayIndex = new Date().getDay() - 1; // 0=Mon, 4=Fri

      return (
        <div className="min-h-screen flex flex-col">
          
          {/* Header - 白背景のヘッダー */}
          <header className="bg-white text-gray-800 sticky top-0 z-30 pt-safe border-b border-gray-100">
            <div className="flex justify-between items-center px-4 py-3 relative max-w-7xl mx-auto w-full">
              <div className="flex-1"></div>
              <h1 className="text-[19px] font-bold flex-1 text-center whitespace-nowrap">2026年 1学期</h1>
              <div className="flex-1 flex justify-end">
                <button onClick={() => alert('下部のタブバー上にあるQ切り替えボタンを使用してください。')} className="text-[11px] font-bold border border-gray-400 text-gray-600 rounded-full px-3 py-1.5 whitespace-nowrap">
                  学期切替
                </button>
              </div>
            </div>
          </header>

          <main className="flex-1 w-full mx-auto pb-32">
            
            {activeTab === 'timetable' && (
              <div className="bg-[#f4f7fb] min-h-full">
                <div className="overflow-x-auto">
                  <table className="w-full border-separate min-w-[320px]" style={{ borderSpacing: '6px' }}>
                    <thead>
                      <tr>
                        <th className="w-10"></th>
                        {days.map((d, i) => (
                          <th key={d.key} className="text-sm font-bold text-gray-500 pb-1 pt-2 w-1/5">
                            <div className={`mx-auto flex items-center justify-center w-7 h-7 rounded-full ${i === (todayIndex >= 0 && todayIndex <= 4 ? todayIndex : 3) ? 'bg-[#3b82f6] text-white' : ''}`}>
                              {d.label}
                            </div>
                          </th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {periods.map(p => (
                        <tr key={p}>
                          <td className="align-top pt-2">
                            <div className="flex flex-col items-center text-gray-400">
                              <span className="text-lg font-bold text-gray-500 leading-none">{p}</span>
                              <span className="text-[8px] leading-tight mt-1">{periodTimes[p].start}</span>
                              <span className="text-[8px] leading-none">|</span>
                              <span className="text-[8px] leading-tight">{periodTimes[p].end}</span>
                            </div>
                          </td>
                          {days.map(d => {
                            const course = getCourseAt(d.key, p);
                            return (
                              <td key={d.key} className="h-[105px] align-top" onClick={() => openModal(d.key, p, course)}>
                                {course ? (
                                  <div className="h-full w-full bg-[#b5d2f6] rounded-[14px] flex flex-col justify-between items-center p-1.5 relative overflow-hidden cursor-pointer shadow-sm active:opacity-70 transition-opacity">
                                    <div className="flex-1 flex items-center justify-center w-full px-0.5">
                                      <span className="text-[11px] font-bold text-gray-800 text-center leading-snug break-words" style={{ display: '-webkit-box', WebkitLineClamp: 3, WebkitBoxOrient: 'vertical', overflow: 'hidden' }}>
                                        {course.name}
                                      </span>
                                    </div>
                                    {course.room && (
                                      <div className="bg-white rounded-full px-2 py-0.5 text-[9px] font-medium text-gray-600 truncate w-[95%] text-center mt-1">
                                        {course.room}
                                      </div>
                                    )}
                                  </div>
                                ) : (
                                  <div className="h-full w-full bg-white rounded-[14px] flex items-center justify-center cursor-pointer active:bg-gray-50 transition-colors">
                                  </div>
                                )}
                              </td>
                            );
                          })}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>

                {/* 学期（第1Q〜第4Q）切り替え - 下部配置 */}
                <div className="fixed bottom-[65px] left-0 right-0 px-4 py-2 bg-gradient-to-t from-[#f4f7fb] via-[#f4f7fb] to-transparent z-20 flex justify-center gap-2 pb-safe">
                  <div className="bg-white rounded-full shadow-md p-1 flex w-full max-w-sm border border-gray-100">
                    {quarters.map(q => (
                      <button
                        key={q}
                        onClick={() => setActiveQuarter(q)}
                        className={`flex-1 py-1.5 text-xs font-bold rounded-full transition-all ${activeQuarter === q ? 'bg-[#3b82f6] text-white shadow' : 'bg-transparent text-gray-500'}`}
                      >
                        {q}
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'links' && (
              <div className="p-4 space-y-4 max-w-2xl mx-auto mt-4">
                <h2 className="text-lg font-bold text-gray-800 mb-4 px-1">外部サイト</h2>
                
                <a href="https://moodle2026.wakayama-u.ac.jp/2026/" target="_blank" rel="noopener noreferrer" className="block bg-white border border-gray-200 rounded-2xl p-5 flex items-center shadow-sm active:bg-gray-50 transition-colors">
                  <div className="bg-orange-100 w-12 h-12 rounded-full flex items-center justify-center text-2xl mr-4 shrink-0">
                    📚
                  </div>
                  <div>
                    <div className="font-bold text-gray-800">和歌山大学Moodle2026</div>
                    <div className="text-[11px] text-gray-500 mt-1">オンライン授業・課題提出プラットフォーム</div>
                  </div>
                  <div className="ml-auto text-gray-300">
                    <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" /></svg>
                  </div>
                </a>

                <a href="https://kmags.wakayama-u.ac.jp/campusweb/campusportal.do?page=main" target="_blank" rel="noopener noreferrer" className="block bg-white border border-gray-200 rounded-2xl p-5 flex items-center shadow-sm active:bg-gray-50 transition-colors">
                  <div className="bg-blue-100 w-12 h-12 rounded-full flex items-center justify-center text-2xl mr-4 shrink-0">
                    🏫
                  </div>
                  <div>
                    <div className="font-bold text-gray-800">教育サポートシステム</div>
                    <div className="text-[11px] text-gray-500 mt-1">履修登録・成績照会・シラバス検索 (CampusWeb)</div>
                  </div>
                  <div className="ml-auto text-gray-300">
                    <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" /></svg>
                  </div>
                </a>
              </div>
            )}

            {activeTab === 'credits' && (
              <div className="p-4 max-w-2xl mx-auto space-y-5 pb-24">
                <h2 className="text-lg font-bold text-gray-800 px-1">卒業要件単位の確認</h2>
                
                {/* 総取得単位数 */}
                <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 text-center">
                  <div className="text-xs font-bold text-gray-400">取得済み総単位数</div>
                  <div className="text-5xl font-extrabold text-[#3b82f6] my-2">
                    {totalCountedCredits} <span className="text-base font-normal text-gray-400">/ 124 単位</span>
                  </div>
                  <div className="w-full bg-gray-100 h-2 rounded-full mt-3 overflow-hidden">
                    <div className="bg-[#3b82f6] h-full transition-all duration-300" style={{ width: `${Math.min((totalCountedCredits / 124) * 100, 100)}%` }}></div>
                  </div>
                </div>

                {/* 経済学部 卒業要件の各項目内訳カウンター */}
                {creditStructure.map(cat => {
                  const catTotal = getCategoryTotal(cat.items);
                  return (
                    <div key={cat.category} className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                      <div className="bg-gray-50 px-4 py-3 border-b border-gray-100 flex justify-between items-center">
                        <span className="font-bold text-gray-800 text-xs">{cat.category}</span>
                        <span className="text-xs font-bold text-[#3b82f6]">
                          {catTotal} / {cat.totalTarget} 単位
                        </span>
                      </div>
                      <div className="divide-y divide-gray-50 px-4">
                        {cat.items.map(item => (
                          <div key={item.key} className="py-3 flex justify-between items-center gap-4">
                            <span className="text-xs text-gray-600 font-medium leading-tight">{item.label}</span>
                            <div className="flex items-center gap-2 shrink-0">
                              <button 
                                type="button" 
                                onClick={() => handleDecrement(item.key)}
                                className="w-7 h-7 rounded-full border border-gray-200 flex items-center justify-center text-gray-500 text-sm font-bold active:bg-gray-100 transition-colors select-none"
                              >
                                -
                              </button>
                              <div className="w-12 text-center">
                                <span className="text-xs font-bold text-gray-800">{creditCounts[item.key] || 0}</span>
                                <span className="text-[10px] text-gray-400 mx-0.5">/</span>
                                <span className="text-[10px] text-gray-400">{item.target}</span>
                              </div>
                              <button 
                                type="button" 
                                onClick={() => handleIncrement(item.key)}
                                className="w-7 h-7 rounded-full bg-blue-50 border border-blue-100 flex items-center justify-center text-[#3b82f6] text-sm font-bold active:bg-blue-100 transition-colors select-none"
                              >
                                +
                              </button>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}

            {activeTab === 'profile' && (
              <div className="p-4 mt-4 max-w-2xl mx-auto space-y-4">
                <h2 className="text-lg font-bold text-gray-800 mb-2 px-1">マイページ</h2>
                <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden p-5 space-y-5">
                  <div>
                    <label className="block text-[11px] font-bold text-gray-500 uppercase mb-1.5">氏名</label>
                    <input type="text" value={user.name} onChange={(e) => setUser({...user, name: e.target.value})} className="w-full border-b border-gray-200 py-2 text-sm focus:outline-none focus:border-[#3b82f6] bg-transparent" placeholder="未設定" />
                  </div>
                  <div>
                    <label className="block text-[11px] font-bold text-gray-500 uppercase mb-1.5">学籍番号</label>
                    <input type="text" value={user.studentId} onChange={(e) => setUser({...user, studentId: e.target.value})} className="w-full border-b border-gray-200 py-2 text-sm focus:outline-none focus:border-[#3b82f6] bg-transparent" placeholder="未設定" />
                  </div>
                  <div>
                    <label className="block text-[11px] font-bold text-gray-500 uppercase mb-1.5">学期</label>
                    <select value={user.semester} onChange={(e) => setUser({...user, semester: e.target.value})} className="w-full border-b border-gray-200 py-2 text-sm focus:outline-none focus:border-[#3b82f6] bg-transparent">
                      {semesters.map(s => <option key={s} value={s}>{s}</option>)}
                    </select>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* Bottom Navigation */}
          <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 z-40 pb-safe">
            <div className="max-w-7xl mx-auto flex justify-around items-center h-[65px] px-2">
              <button onClick={() => setActiveTab('timetable')} className={`flex flex-col items-center justify-center w-full h-full text-[10px] ${activeTab === 'timetable' ? 'text-[#3b82f6] font-bold' : 'text-gray-400'}`}>
                <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6 mb-1" fill={activeTab === 'timetable' ? "currentColor" : "none"} viewBox="0 0 24 24" stroke="currentColor" strokeWidth={activeTab === 'timetable' ? 0 : 2}>
                  <path strokeLinecap="round" strokeLinejoin="round" d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                </svg>
                時間割
              </button>
              <button onClick={() => setActiveTab('credits')} className={`flex flex-col items-center justify-center w-full h-full text-[10px] ${activeTab === 'credits' ? 'text-[#3b82f6] font-bold' : 'text-gray-400'}`}>
                <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6 mb-1" fill={activeTab === 'credits' ? "currentColor" : "none"} viewBox="0 0 24 24" stroke="currentColor" strokeWidth={activeTab === 'credits' ? 0 : 2}>
                  <path strokeLinecap="round" strokeLinejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                スケジュール
              </button>
              <button onClick={() => setActiveTab('links')} className={`flex flex-col items-center justify-center w-full h-full text-[10px] ${activeTab === 'links' ? 'text-[#3b82f6] font-bold' : 'text-gray-400'}`}>
                <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6 mb-1" fill={activeTab === 'links' ? "currentColor" : "none"} viewBox="0 0 24 24" stroke="currentColor" strokeWidth={activeTab === 'links' ? 0 : 2}>
                  <path strokeLinecap="round" strokeLinejoin="round" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9" />
                </svg>
                外部サイト
              </button>
              <button onClick={() => setActiveTab('profile')} className={`flex flex-col items-center justify-center w-full h-full text-[10px] ${activeTab === 'profile' ? 'text-[#3b82f6] font-bold' : 'text-gray-400'}`}>
                <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6 mb-1" fill={activeTab === 'profile' ? "currentColor" : "none"} viewBox="0 0 24 24" stroke="currentColor" strokeWidth={activeTab === 'profile' ? 0 : 2}>
                  <path strokeLinecap="round" strokeLinejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
                マイページ
              </button>
            </div>
          </div>

          {/* Modal */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
              <div className="bg-white rounded-2xl shadow-xl w-full max-w-sm overflow-hidden animate-[fadeIn_0.2s_ease-out]">
                <div className="p-4 border-b border-gray-100 flex justify-between items-center">
                  <h3 className="font-bold text-gray-800 text-sm">{editingCourse ? '授業の編集' : '新しい授業を追加'}</h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-gray-400 hover:text-gray-600 font-bold text-xl leading-none">&times;</button>
                </div>
                <form onSubmit={handleSaveCourse} className="p-5 space-y-4">
                  <div>
                    <label className="block text-[10px] font-bold text-gray-500 mb-1">授業名 <span className="text-red-500">*</span></label>
                    <input type="text" value={formValues.name} onChange={e => setFormValues({...formValues, name: e.target.value})} className="w-full border border-gray-200 rounded-lg p-2.5 text-sm focus:border-[#3b82f6] focus:outline-none" required />
                  </div>
                  <div>
                    <label className="block text-[10px] font-bold text-gray-500 mb-1">教室</label>
                    <input type="text" value={formValues.room} onChange={e => setFormValues({...formValues, room: e.target.value})} className="w-full border border-gray-200 rounded-lg p-2.5 text-sm focus:border-[#3b82f6] focus:outline-none" />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-[10px] font-bold text-gray-500 mb-1">学期</label>
                      <select value={formValues.quarter} onChange={e => setFormValues({...formValues, quarter: e.target.value})} className="w-full border border-gray-200 rounded-lg p-2.5 text-sm bg-white">
                        {quarters.map(q => <option key={q} value={q}>{q}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-[10px] font-bold text-gray-500 mb-1">単位</label>
                      <select value={formValues.credits} onChange={e => setFormValues({...formValues, credits: Number(e.target.value)})} className="w-full border border-gray-200 rounded-lg p-2.5 text-sm bg-white">
                        <option value={1}>1 単位</option><option value={2}>2 単位</option><option value={4}>4 単位</option>
                      </select>
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-[10px] font-bold text-gray-500 mb-1">曜日</label>
                      <select value={formValues.day} onChange={e => setFormValues({...formValues, day: e.target.value})} className="w-full border border-gray-200 rounded-lg p-2.5 text-sm bg-white">
                        {days.map(d => <option key={d.key} value={d.key}>{d.label}曜日</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-[10px] font-bold text-gray-500 mb-1">時限</label>
                      <select value={formValues.period} onChange={e => setFormValues({...formValues, period: Number(e.target.value)})} className="w-full border border-gray-200 rounded-lg p-2.5 text-sm bg-white">
                        {periods.map(p => <option key={p} value={p}>{p}限</option>)}
                      </select>
                    </div>
                  </div>
                  <div className="pt-4 mt-2 border-t border-gray-100 flex justify-between items-center">
                    {editingCourse ? (
                      <button type="button" onClick={() => handleDeleteCourse(editingCourse.id)} className="text-red-500 text-xs font-bold px-2 py-2">削除</button>
                    ) : <div></div>}
                    <div className="flex gap-2">
                      <button type="button" onClick={() => setIsModalOpen(false)} className="bg-gray-100 text-gray-600 px-4 py-2.5 rounded-xl text-xs font-bold">キャンセル</button>
                      <button type="submit" className="bg-[#3b82f6] text-white px-5 py-2.5 rounded-xl text-xs font-bold shadow-sm">保存</button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
