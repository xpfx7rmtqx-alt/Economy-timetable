<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wadai Economy Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      background-color: #f3f4f6;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
    }
    .pb-safe {
      padding-bottom: calc(0px + env(safe-area-inset-bottom, 0px));
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [user, setUser] = useState(() => {
        const saved = localStorage.getItem('wadai_user');
        return saved ? JSON.parse(saved) : { name: '', studentId: '', semester: '1年前期' };
      });

      const [courses, setCourses] = useState(() => {
        const saved = localStorage.getItem('wadai_courses');
        return saved ? JSON.parse(saved) : [];
      });

      const [activeTab, setActiveTab] = useState('timetable');
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingCourse, setEditingCourse] = useState(null);

      const [formValues, setFormValues] = useState({
        name: '', room: '', day: 'Mon', period: 1, credits: 2, category: 'common', semester: '前期'
      });

      useEffect(() => {
        localStorage.setItem('wadai_user', JSON.stringify(user));
      }, [user]);

      useEffect(() => {
        localStorage.setItem('wadai_courses', JSON.stringify(courses));
      }, [courses]);

      const days = [
        { key: 'Mon', label: '月' },
        { key: 'Tue', label: '火' },
        { key: 'Wed', label: '水' },
        { key: 'Thu', label: '木' },
        { key: 'Fri', label: '金' }
      ];
      const periods = [1, 2, 3, 4, 5];

      const categories = {
        common: { label: '共通教育科目', color: 'bg-emerald-500', text: 'text-emerald-700', bgLight: 'bg-emerald-50', border: 'border-emerald-200', target: 40 },
        specialized: { label: '専門教育科目', color: 'bg-blue-500', text: 'text-blue-700', bgLight: 'bg-blue-50', border: 'border-blue-200', target: 64 },
        related: { label: '関連科目', color: 'bg-amber-500', text: 'text-amber-700', bgLight: 'bg-amber-50', border: 'border-amber-200', target: 20 }
      };

      const semesters = ['1年前期', '1年後期', '2年前期', '2年後期', '3年前期', '3年後期', '4年前期', '4年後期'];

      const getCourseAt = (day, period) => {
        return courses.find(c => c.day === day && Number(c.period) === Number(period));
      };

      const openModal = (day = 'Mon', period = 1, course = null) => {
        if (course) {
          setEditingCourse(course);
          setFormValues({ ...course });
        } else {
          setEditingCourse(null);
          setFormValues({
            name: '',
            room: '',
            day: day,
            period: period,
            credits: 2,
            category: 'common',
            semester: user.semester.includes('前期') ? '前期' : '後期'
          });
        }
        setIsModalOpen(true);
      };

      const handleSaveCourse = (e) => {
        e.preventDefault();
        if (!formValues.name.trim()) return alert('授業名を入力してください');

        if (editingCourse) {
          setCourses(courses.map(c => c.id === editingCourse.id ? { ...formValues } : c));
        } else {
          const existing = getCourseAt(formValues.day, formValues.period);
          if (existing) {
            if (!confirm('このコマには既に授業が登録されています。上書きしますか？')) return;
            setCourses(courses.filter(c => c.id !== existing.id).concat({ ...formValues, id: Date.now().toString() }));
          } else {
            setCourses([...courses, { ...formValues, id: Date.now().toString() }]);
          }
        }
        setIsModalOpen(false);
      };

      const handleDeleteCourse = (id) => {
        if (confirm('この授業を削除しますか？')) {
          setCourses(courses.filter(c => c.id !== id));
          setIsModalOpen(false);
        }
      };

      const totalCredits = courses.reduce((sum, c) => sum + Number(c.credits), 0);
      const categoryCredits = (cat) => courses.filter(c => c.category === cat).reduce((sum, c) => sum + Number(c.credits), 0);

      return (
        <div className="min-h-screen flex flex-col pb-24">
          <header className="bg-[#003B71] text-white shadow-md p-4 sticky top-0 z-30">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-2">
              <div>
                <h1 className="text-xl font-bold tracking-wider text-center sm:text-left">Wadai Economy Portal</h1>
                <p className="text-xs text-blue-200 mt-0.5 text-center sm:text-left">和歌山大学経済学部生向け ポータル</p>
              </div>
              <div className="flex items-center gap-3 bg-white/10 px-4 py-1.5 rounded-lg text-xs">
                <div className="text-center sm:text-right">
                  <span className="font-medium mr-2">{user.name || '未設定'}</span>
                  <span className="text-blue-200">{user.studentId ? `学籍番号: ${user.studentId}` : '学籍番号未設定'} | {user.semester}</span>
                </div>
              </div>
            </div>
          </header>

          <main className="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6">
            {activeTab === 'timetable' && (
              <div className="space-y-4">
                <div className="flex justify-between items-center">
                  <h2 className="text-lg font-bold text-gray-800">今学期の時間割</h2>
                  <p className="text-xs text-gray-500">※ コマを選択して入力できます</p>
                </div>
                <div className="overflow-x-auto bg-white rounded-xl shadow-sm border border-gray-200">
                  <table className="w-full border-collapse min-w-[650px]">
                    <thead>
                      <tr className="bg-gray-50 border-b border-gray-200">
                        <th className="w-16 p-3 text-center text-xs font-bold text-gray-500 tracking-wider">時限</th>
                        {days.map(d => (
                          <th key={d.key} className="p-3 text-center text-sm font-bold text-gray-700 tracking-wider w-1/5 border-l border-gray-200">
                            {d.label}曜日
                          </th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {periods.map(p => (
                        <tr key={p} className="border-b border-gray-100 last:border-none">
                          <td className="p-4 text-center bg-gray-50/50">
                            <div className="font-bold text-gray-700">{p}</div>
                            <div className="text-[10px] text-gray-400 mt-0.5">限</div>
                          </td>
                          {days.map(d => {
                            const course = getCourseAt(d.key, p);
                            return (
                              <td 
                                key={d.key} 
                                onClick={() => openModal(d.key, p, course)}
                                className="p-2 border-l border-gray-100 align-top h-28 cursor-pointer transition-all hover:bg-gray-50 group relative"
                              >
                                {course ? (
                                  <div className={`h-full w-full rounded-lg p-2 border ${categories[course.category].border} ${categories[course.category].bgLight} flex flex-col justify-between shadow-sm`}>
                                    <div>
                                      <div className="text-xs font-bold text-gray-800 line-clamp-2 leading-snug">{course.name}</div>
                                      {course.room && (
                                        <div className="text-[11px] text-gray-500 mt-1 flex items-center gap-0.5">📍 {course.room}</div>
                                      )}
                                    </div>
                                    <div className="flex justify-between items-center mt-2 pt-1 border-t border-gray-200/50">
                                      <span className={`text-[9px] px-1.5 py-0.5 rounded font-bold uppercase text-white ${categories[course.category].color}`}>
                                        {course.credits}単位
                                      </span>
                                      <span className="text-[10px] text-gray-400 opacity-0 group-hover:opacity-100 transition-opacity">編集</span>
                                    </div>
                                  </div>
                                ) : (
                                  <div className="h-full w-full border border-dashed border-gray-200 rounded-lg flex items-center justify-center text-gray-300 group-hover:text-gray-400 group-hover:border-gray-300 transition-colors">
                                    <span className="text-xl font-light">+</span>
                                  </div>
                                )}
                              </td>
                            );
                          })}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {activeTab === 'credits' && (
              <div className="space-y-6">
                <h2 className="text-lg font-bold text-gray-800">卒業要件単位の確認・進捗</h2>
                <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200 grid grid-cols-1 md:grid-cols-3 gap-6">
                  <div className="md:col-span-1 bg-[#003B71]/5 p-4 rounded-lg flex flex-col justify-center items-center border border-[#003B71]/10">
                    <div className="text-sm font-medium text-gray-600">登録済み総単位数</div>
                    <div className="text-4xl font-extrabold text-[#003B71] my-1">{totalCredits} <span className="text-sm font-normal text-gray-500">/ 124 単位</span></div>
                    <div className="w-full bg-gray-200 h-2 rounded-full mt-2 overflow-hidden">
                      <div className="bg-[#003B71] h-full transition-all duration-500" style={{ width: `${Math.min((totalCredits / 124) * 100, 100)}%` }}></div>
                    </div>
                  </div>
                  <div className="md:col-span-2 grid grid-cols-1 sm:grid-cols-3 gap-4">
                    {Object.entries(categories).map(([key, cat]) => {
                      const current = categoryCredits(key);
                      const percent = Math.min((current / cat.target) * 100, 100);
                      return (
                        <div key={key} className="bg-gray-50 p-4 rounded-lg border border-gray-200 flex flex-col justify-between">
                          <div>
                            <div className="text-xs font-bold text-gray-500">{cat.label}</div>
                            <div className={`text-xl font-bold mt-1 ${cat.text}`}>{current} <span className="text-xs font-normal text-gray-400">/ {cat.target}</span></div>
                          </div>
                          <div className="w-full bg-gray-200 h-1.5 rounded-full mt-3 overflow-hidden">
                            <div className={`${cat.color} h-full transition-all duration-500`} style={{ width: `${percent}%` }}></div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                  <div className="p-4 border-b border-gray-200 bg-gray-50">
                    <h3 className="font-bold text-gray-700">登録済みの授業一覧 ({courses.length}件)</h3>
                  </div>
                  {courses.length === 0 ? (
                    <div className="p-8 text-center text-gray-400 text-sm">
                      登録されている授業はありません。「時間割」から授業を追加してください。
                    </div>
                  ) : (
                    <div className="divide-y divide-gray-100">
                      {courses.map(c => (
                        <div key={c.id} className="p-4 flex justify-between items-center hover:bg-gray-50 transition-colors">
                          <div className="space-y-1">
                            <div className="font-bold text-gray-800 text-sm">{c.name}</div>
                            <div className="text-xs text-gray-500 flex items-center gap-3">
                              <span>区分: {categories[c.category].label}</span>
                              <span>単位: {c.credits}</span>
                              <span>時間: {days.find(d => d.key === c.day)?.label}曜{c.period}限</span>
                              {c.room && <span>教室: {c.room}</span>}
                            </div>
                          </div>
                          <button 
                            onClick={() => openModal(c.day, c.period, c)}
                            className="text-xs text-gray-500 hover:text-[#003B71] border border-gray-200 px-2.5 py-1 rounded hover:bg-gray-100 transition-colors"
                          >
                            編集
                          </button>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            )}

            {activeTab === 'profile' && (
              <div className="bg-white rounded-xl shadow-sm border border-gray-200 max-w-xl mx-auto overflow-hidden">
                <div className="p-4 border-b border-gray-200 bg-gray-50">
                  <h2 className="font-bold text-gray-800">学生情報の確認・設定</h2>
                  <p className="text-xs text-gray-500 mt-0.5">※ 入力した情報はブラウザに自動保存されます</p>
                </div>
                <div className="p-6 space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-gray-600 uppercase mb-1">氏名 / ニックネーム</label>
                    <input 
                      type="text" 
                      value={user.name}
                      onChange={(e) => setUser({...user, name: e.target.value})}
                      placeholder="例: 和大太郎"
                      className="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:outline-none focus:border-[#003B71]"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-gray-600 uppercase mb-1">学籍番号</label>
                    <input 
                      type="text" 
                      value={user.studentId}
                      onChange={(e) => setUser({...user, studentId: e.target.value})}
                      placeholder="例: E23XXXX"
                      className="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:outline-none focus:border-[#003B71]"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-gray-600 uppercase mb-1">現在の所属・学期</label>
                    <select 
                      value={user.semester}
                      onChange={(e) => setUser({...user, semester: e.target.value})}
                      className="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:outline-none focus:border-[#003B71] bg-white"
                    >
                      {semesters.map(s => <option key={s} value={s}>{s}</option>)}
                    </select>
                  </div>
                </div>
              </div>
            )}
          </main>

          <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-[0_-4px_12px_rgba(0,0,0,0.08)] z-40 pb-safe">
            <div className="max-w-7xl mx-auto flex justify-around items-center py-2 px-1">
              <button 
                onClick={() => setActiveTab('timetable')}
                className={`flex flex-col items-center justify-center flex-1 py-1 text-[11px] font-medium ${activeTab === 'timetable' ? 'text-[#003B71] font-bold' : 'text-gray-400'}`}
              >
                <span className="text-xl mb-0.5">📅</span>
                <span>時間割</span>
              </button>
              <button 
                onClick={() => setActiveTab('credits')}
                className={`flex flex-col items-center justify-center flex-1 py-1 text-[11px] font-medium ${activeTab === 'credits' ? 'text-[#003B71] font-bold' : 'text-gray-400'}`}
              >
                <span className="text-xl mb-0.5">🎓</span>
                <span>単位進捗</span>
              </button>
              <button 
                onClick={() => setActiveTab('profile')}
                className={`flex flex-col items-center justify-center flex-1 py-1 text-[11px] font-medium ${activeTab === 'profile' ? 'text-[#003B71] font-bold' : 'text-gray-400'}`}
              >
                <span className="text-xl mb-0.5">👤</span>
                <span>マイページ</span>
              </button>
              <a 
                href="https://kmags.wakayama-u.ac.jp/campusweb/campusportal.do?page=main" 
                target="_blank" 
                rel="noopener noreferrer"
                className="flex flex-col items-center justify-center flex-1 py-1 text-[10px] font-medium text-gray-400 text-center"
              >
                <span className="text-xl mb-0.5">🏫</span>
                <span className="leading-tight tracking-tighter truncate w-full px-0.5">教育サポート</span>
              </a>
              <a 
                href="https://moodle2026.wakayama-u.ac.jp/2026/" 
                target="_blank" 
                rel="noopener noreferrer"
                className="flex flex-col items-center justify-center flex-1 py-1 text-[10px] font-medium text-gray-400 text-center"
              >
                <span className="text-xl mb-0.5">📝</span>
                <span className="leading-tight tracking-tighter truncate w-full px-0.5">Moodle</span>
              </a>
            </div>
          </div>

          {isModalOpen && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-xl shadow-xl border border-gray-200 max-w-md w-full overflow-hidden">
                <div className="p-4 border-b border-gray-200 bg-gray-50 flex justify-between items-center">
                  <h3 className="font-bold text-gray-800">
                    {editingCourse ? '授業の編集' : '新しい授業を追加'} ({days.find(d => d.key === formValues.day)?.label}曜{formValues.period}限)
                  </h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-gray-400 hover:text-gray-600 font-bold text-lg">×</button>
                </div>
                
                <form onSubmit={handleSaveCourse} className="p-6 space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-gray-600 mb-1">授業名 <span className="text-red-500">*</span></label>
                    <input 
                      type="text"
                      value={formValues.name}
                      onChange={e => setFormValues({...formValues, name: e.target.value})}
                      placeholder="例: マクロ経済学基礎"
                      className="w-full border border-gray-300 rounded-lg p-2 text-sm focus:border-[#003B71] focus:outline-none"
                      required
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-bold text-gray-600 mb-1">教室 / 講義室</label>
                      <input 
                        type="text"
                        value={formValues.room}
                        onChange={e => setFormValues({...formValues, room: e.target.value})}
                        placeholder="例: 101教室"
                        className="w-full border border-gray-300 rounded-lg p-2 text-sm focus:border-[#003B71] focus:outline-none"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-gray-600 mb-1">単位数</label>
                      <select 
                        value={formValues.credits}
                        onChange={e => setFormValues({...formValues, credits: Number(e.target.value)})}
                        className="w-full border border-gray-300 rounded-lg p-2 text-sm focus:border-[#003B71] focus:outline-none bg-white"
                      >
                        <option value={1}>1 単位</option>
                        <option value={2}>2 単位</option>
                        <option value={4}>4 単位</option>
                      </select>
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-gray-600 mb-1">科目区分</label>
                    <select 
                      value={formValues.category}
                      onChange={e => setFormValues({...formValues, category: e.target.value})}
                      className="w-full border border-gray-300 rounded-lg p-2 text-sm focus:border-[#003B71] focus:outline-none bg-white"
                    >
                      <option value="common">共通教育科目 (教養・言語など)</option>
                      <option value="specialized">専門教育科目 (経済学部専門科目)</option>
                      <option value="related">関連科目・自由選択</option>
                    </select>
                  </div>
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-bold text-gray-600 mb-1">曜日</label>
                      <select 
                        value={formValues.day}
                        onChange={e => setFormValues({...formValues, day: e.target.value})}
                        className="w-full border border-gray-300 rounded-lg p-2 text-sm focus:border-[#003B71] focus:outline-none bg-white"
                      >
                        {days.map(d => <option key={d.key} value={d.key}>{d.label}曜日</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-gray-600 mb-1">時限</label>
                      <select 
                        value={formValues.period}
                        onChange={e => setFormValues({...formValues, period: Number(e.target.value)})}
                        className="w-full border border-gray-300 rounded-lg p-2 text-sm focus:border-[#003B71] focus:outline-none bg-white"
                      >
                        {periods.map(p => <option key={p} value={p}>{p}限</option>)}
                      </select>
                    </div>
                  </div>
                  <div className="pt-4 border-t border-gray-100 flex justify-between items-center gap-2">
                    {editingCourse ? (
                      <button 
                        type="button"
                        onClick={() => handleDeleteCourse(editingCourse.id)}
                        className="bg-red-50 text-red-600 border border-red-200 px-4 py-2 rounded-lg text-sm font-medium"
                      >
                        削除する
                      </button>
                    ) : <div />}
                    <div className="flex gap-2">
                      <button 
                        type="button"
                        onClick={() => setIsModalOpen(false)}
                        className="bg-gray-100 text-gray-600 px-4 py-2 rounded-lg text-sm font-medium"
                      >
                        キャンセル
                      </button>
                      <button 
                        type="submit"
                        className="bg-[#003B71] text-white px-5 py-2 rounded-lg text-sm font-medium"
                      >
                        保存する
                      </button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
